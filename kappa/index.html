<!doctype html>
 <html lang="zh-Hant">
 <head>
 <meta charset="utf-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1" />
 <title>品質檢驗 Kappa 計算器</title>
 <style>
 :root{--bg:#f8fafc;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--blue:#2563eb;--green:#059669;--red:#e11d48;--amber:#d97706}
 *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;color:var(--ink);background:linear-gradient(#f8fafc,#fff)}
 .wrap{max-width:1200px;margin:auto;padding:30px 18px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.lang-switch{display:flex;gap:6px;background:#e2e8f0;padding:4px;border-radius:12px}.lang-btn{border:0;background:transparent;padding:7px 12px;border-radius:9px;cursor:pointer;font-weight:700;color:#475569}.lang-btn.active{background:#fff;color:#0f172a;box-shadow:0 1px 4px #94a3b855}.pill{display:inline-flex;gap:8px;align-items:center;background:#111827;color:#fff;padding:7px 12px;border-radius:12px;font-size:14px}
 h1{font-size:clamp(32px,5vw,52px);margin:18px 0 10px}.lead{color:#475569;font-size:18px;line-height:1.7;max-width:1000px}
 .tabs{display:grid;grid-template-columns:1fr 1fr;max-width:720px;background:#f1f5f9;padding:5px;border-radius:15px;margin:28px 0 24px}.tab{border:0;background:transparent;padding:14px;border-radius:11px;font-size:16px;cursor:pointer}.tab.active{background:#fff;box-shadow:0 1px 5px #cbd5e1}
 .panel{display:none}.panel.active{display:block}.layout{display:grid;grid-template-columns:1.05fr .95fr;gap:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 2px 10px #0f172a0a;margin-bottom:14px}.pad{padding:18px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
 h2,h3{margin:0}.muted{color:var(--muted);font-size:14px}.btn{border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:10px;cursor:pointer}.btn:hover{background:#f8fafc}.btn.primary{background:#0f172a;color:#fff}
 .table-wrap{overflow:auto;max-height:450px}table{width:100%;border-collapse:collapse;min-width:560px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left}thead{background:#f8fafc;position:sticky;top:0}input,select{width:100%;height:38px;border:1px solid #cbd5e1;border-radius:8px;padding:0 10px;background:#fff}.delete{border:0;background:transparent;color:var(--red);font-size:18px;cursor:pointer}
 .metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.metric{padding:16px}.metric .value{font-size:28px;font-weight:750;margin-top:5px}.rates{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.okcell{background:#ecfdf5;text-align:center;font-weight:700}.badcell{background:#fff1f2;text-align:center}
 .interpret{display:flex;gap:12px}.badge{display:inline-block;padding:4px 9px;border-radius:999px;background:#e2e8f0;font-size:12px;font-weight:700}.range-table tr.current{background:#eff6ff}.range-table tr.current td:nth-child(2){font-weight:700;color:#1d4ed8}
 footer{text-align:center;color:#94a3b8;font-size:12px;margin-top:20px}@media(max-width:900px){.layout{grid-template-columns:1fr}.rates{grid-template-columns:1fr}.metrics{grid-template-columns:1fr}}
 </style>
 </head>
 <body>
 <div class="wrap">
 <div class="topbar"><div class="pill">▦ Attribute Agreement Analysis</div><div class="lang-switch" aria-label="Language"><button id="langZh" class="lang-btn active" type="button" onclick="setLanguage('zh')">中文</button><button id="langEn" class="lang-btn" type="button" onclick="setLanguage('en')">English</button></div></div>
 <h1 id="pageTitle">品質檢驗 Kappa 計算器</h1>
 <p id="pageLead" class="lead">使用 Cohen’s Kappa 考核個別檢驗員與標準答案的一致性，或使用 Fleiss’ Kappa 評估多位檢驗員的團隊一致性。</p>
 <div class="tabs"><button id="tabCohen" class="tab active" data-tab="cohen">個人 vs 標準</button><button id="tabFleiss" class="tab" data-tab="fleiss">多人團隊一致性</button></div>
 <section id="cohen" class="panel active"><div class="layout"><div><div class="head"><div><h2 id="cohenHeading">輸入判定資料</h2><div id="cohenHint" class="muted">標準答案及檢驗員只能選擇 OK 或 NG。</div></div><button id="exportCohen" class="btn" onclick="exportCSV('cohen')">⇩ 匯出</button></div><div class="card"><div class="table-wrap"><table><thead><tr><th>樣品</th><th>標準答案</th><th>檢驗員</th><th></th></tr></thead><tbody id="cohenBody"></tbody></table></div><div class="pad"><button id="addCohenBtn" class="btn" onclick="addCohen()">＋ 新增樣品</button></div></div></div><div id="cohenResult"></div></div></section>
 <section id="fleiss" class="panel"><div class="layout"><div><div class="head"><div><h2 id="fleissHeading">輸入多人判定資料</h2><div id="fleissHint" class="muted">每位檢驗員只能選擇 OK 或 NG。</div></div><button id="exportFleiss" class="btn" onclick="exportCSV('fleiss')">⇩ 匯出</button></div><div class="card"><div class="table-wrap"><table><thead><tr><th>樣品</th><th>檢驗員 A</th><th>檢驗員 B</th><th>檢驗員 C</th><th>檢驗員 D</th><th></th></tr></thead><tbody id="fleissBody"></tbody></table></div><div class="pad"><button id="addFleissBtn" class="btn" onclick="addFleiss()">＋ 新增樣品</button></div></div></div><div id="fleissResult"></div></div></section>
 <footer id="footerText">此工具用於品質改善與內部分析。正式認證門檻應由組織依風險、客戶要求與程序文件制定。</footer>
 </div>
 <script>
 let currentLanguage='zh';
 const languageText={
 zh:{
 title:'品質檢驗 Kappa 計算器',
 lead:'使用 Cohen’s Kappa 考核個別檢驗員與標準答案的一致性，或使用 Fleiss’ Kappa 評估多位檢驗員的團隊一致性。',
 tabCohen:'個人 vs 標準',tabFleiss:'多人團隊一致性',
 cohenHeading:'輸入判定資料',cohenHint:'標準答案及檢驗員只能選擇 OK 或 NG。',
 fleissHeading:'輸入多人判定資料',fleissHint:'每位檢驗員只能選擇 OK 或 NG。',
 export:'⇩ 匯出',add:'＋ 新增樣品',footer:'此工具用於品質改善與內部分析。正式認證門檻應由組織依風險、客戶要求與程序文件制定。',
 sample:'樣品',standard:'標準答案',inspector:'檢驗員',select:'請選擇',
 inspectorA:'檢驗員 A',inspectorB:'檢驗員 B',inspectorC:'檢驗員 C',inspectorD:'檢驗員 D',
 noCalc:'無法計算',needData:'請確認資料至少包含 OK 與 NG。',result:'結果解讀',current:'（目前結果）',
 range:'Kappa 範圍',level:'一致性等級',definition:'判斷定義',kappa:'Kappa κ',valid:'有效樣品數',samplesRaters:'樣品數 × 評分者',
 accuracy:'正確率',miss:'漏檢率',falseReject:'誤判率',matrix:'交叉表',matrixHead:'標準 / 檢驗員',waiting:'輸入完整資料後，結果會即時計算。',
 ranges:[['低於隨機','實際一致程度低於隨機預期，判定可能存在系統性分歧。'],['輕微一致','僅有非常有限的一致性，通常需要重新訓練或釐清判定標準。'],['尚可一致','具有初步一致性，但穩定度仍不足，建議分析不一致樣品。'],['中度一致','判定具有中等程度的一致性，可使用但仍有改善空間。'],['高度一致','判定一致性良好，可搭配正確率、漏檢率及誤判率評估資格。'],['近乎完全一致','判定結果高度穩定且一致，仍建議定期以盲測確認能力。']]
 },
 en:{
 title:'Quality Inspection Kappa Calculator',
 lead:'Use Cohen’s Kappa to assess agreement between an individual inspector and the reference standard, or Fleiss’ Kappa to assess agreement across multiple inspectors.',
 tabCohen:'Individual vs Standard',tabFleiss:'Multi-inspector Agreement',
 cohenHeading:'Enter Rating Data',cohenHint:'The reference result and inspector rating can only be OK or NG.',
 fleissHeading:'Enter Multi-inspector Data',fleissHint:'Each inspector rating can only be OK or NG.',
 export:'⇩ Export',add:'＋ Add Sample',footer:'This tool is intended for quality improvement and internal analysis. Formal qualification thresholds should be defined according to organizational risk, customer requirements, and controlled procedures.',
 sample:'Sample',standard:'Reference',inspector:'Inspector',select:'Select',
 inspectorA:'Inspector A',inspectorB:'Inspector B',inspectorC:'Inspector C',inspectorD:'Inspector D',
 noCalc:'Cannot calculate',needData:'Make sure the data include both OK and NG.',result:'Interpretation',current:' (current result)',
 range:'Kappa range',level:'Agreement level',definition:'Definition',kappa:'Kappa κ',valid:'Valid samples',samplesRaters:'Samples × Raters',
 accuracy:'Accuracy',miss:'Miss rate',falseReject:'False reject rate',matrix:'Confusion Matrix',matrixHead:'Reference / Inspector',waiting:'Results are calculated after complete data are entered.',
 ranges:[['Below chance','Observed agreement is lower than chance expectation, which may indicate systematic disagreement.'],['Slight agreement','Agreement is very limited. Retraining or clarification of inspection criteria is usually required.'],['Fair agreement','Initial agreement is present, but stability remains insufficient. Review disagreement samples.'],['Moderate agreement','Agreement is moderate and usable, but further improvement is recommended.'],['Substantial agreement','Agreement is good. Use accuracy, miss rate, and false reject rate together for qualification.'],['Almost perfect agreement','Ratings are highly stable and consistent. Periodic blind testing is still recommended.']]
 }
 };
 function setLanguage(lang){
 currentLanguage=lang;
 document.documentElement.lang=lang==='zh'?'zh-Hant':'en';
 const t=languageText[lang];
 document.getElementById('pageTitle').textContent=t.title;
 document.getElementById('pageLead').textContent=t.lead;
 document.getElementById('tabCohen').textContent=t.tabCohen;
 document.getElementById('tabFleiss').textContent=t.tabFleiss;
 document.getElementById('cohenHeading').textContent=t.cohenHeading;
 document.getElementById('cohenHint').textContent=t.cohenHint;
 document.getElementById('fleissHeading').textContent=t.fleissHeading;
 document.getElementById('fleissHint').textContent=t.fleissHint;
 document.getElementById('exportCohen').textContent=t.export;
 document.getElementById('exportFleiss').textContent=t.export;
 document.getElementById('addCohenBtn').textContent=t.add;
 document.getElementById('addFleissBtn').textContent=t.add;
 document.getElementById('footerText').textContent=t.footer;
 document.getElementById('langZh').classList.toggle('active',lang==='zh');
 document.getElementById('langEn').classList.toggle('active',lang==='en');
 render();
 }
 const ranges=[[-Infinity,0,'κ < 0.00','低於隨機','實際一致程度低於隨機預期，判定可能存在系統性分歧。'],[0,.2,'0.00 ≤ κ ≤ 0.20','輕微一致','僅有非常有限的一致性，通常需要重新訓練或釐清判定標準。'],[.2,.4,'0.20 < κ ≤ 0.40','尚可一致','具有初步一致性，但穩定度仍不足，建議分析不一致樣品。'],[.4,.6,'0.40 < κ ≤ 0.60','中度一致','判定具有中等程度的一致性，可使用但仍有改善空間。'],[.6,.8,'0.60 < κ ≤ 0.80','高度一致','判定一致性良好，可搭配正確率、漏檢率及誤判率評估資格。'],[.8,1,'0.80 < κ ≤ 1.00','近乎完全一致','判定結果高度穩定且一致，仍建議定期以盲測確認能力。']];
 let cohen=[['S001','OK','OK'],['S002','NG','NG'],['S003','NG','OK'],['S004','OK','OK'],['S005','NG','NG'],['S006','OK','NG']];
 let fleiss=[['S001','OK','OK','OK','OK'],['S002','NG','NG','NG','OK'],['S003','NG','OK','NG','NG'],['S004','OK','OK','OK','OK'],['S005','NG','NG','NG','NG'],['S006','OK','NG','OK','OK']];
 const sel=v=>`<select onchange="edit(event)"><option value="">${languageText[currentLanguage].select}</option><option ${v==='OK'?'selected':''}>OK</option><option ${v==='NG'?'selected':''}>NG</option></select>`;
 function render(){
 const t=languageText[currentLanguage];
 document.querySelector('#cohen table thead tr').innerHTML=`<th>${t.sample}</th><th>${t.standard}</th><th>${t.inspector}</th><th></th>`;
 document.querySelector('#fleiss table thead tr').innerHTML=`<th>${t.sample}</th><th>${t.inspectorA}</th><th>${t.inspectorB}</th><th>${t.inspectorC}</th><th>${t.inspectorD}</th><th></th>`;
 document.getElementById('cohenBody').innerHTML=cohen.map((r,i)=>`<tr data-kind="cohen" data-i="${i}"><td><input value="${r[0]}" onchange="edit(event)"></td><td>${sel(r[1])}</td><td>${sel(r[2])}</td><td><button class="delete" onclick="removeRow('cohen',${i})">×</button></td></tr>`).join('');
 document.getElementById('fleissBody').innerHTML=fleiss.map((r,i)=>`<tr data-kind="fleiss" data-i="${i}"><td><input value="${r[0]}" onchange="edit(event)"></td>${r.slice(1).map(sel).map(x=>`<td>${x}</td>`).join('')}<td><button class="delete" onclick="removeRow('fleiss',${i})">×</button></td></tr>`).join('');
 calcAll();
 }
 function edit(e){const tr=e.target.closest('tr'),kind=tr.dataset.kind,i=+tr.dataset.i,c=[...tr.children].indexOf(e.target.closest('td'));(kind==='cohen'?cohen:fleiss)[i][c]=e.target.value;calcAll()}
 function addCohen(){cohen.push([`S${String(cohen.length+1).padStart(3,'0')}`,'','']);render()}
 function addFleiss(){fleiss.push([`S${String(fleiss.length+1).padStart(3,'0')}`,'','','','']);render()}
 function removeRow(k,i){if(k==='cohen')cohen.splice(i,1);else fleiss.splice(i,1);render()}
 function interp(k){const t=languageText[currentLanguage];if(!Number.isFinite(k))return [t.noCalc,t.needData];const index=ranges.findIndex((x,i)=>i===0?k<x[1]:k>x[0]&&k<=x[1]);return t.ranges[index<0?1:index]}
 function interpretation(k){const t=languageText[currentLanguage],x=interp(k);return `<div class="card pad"><div class="interpret"><b>${Number.isFinite(k)&&k>.6?'✓':'⚠'}</b><div><h3>${t.result} <span class="badge">${x[0]}</span></h3><p class="muted">${x[1]}</p></div></div><div class="table-wrap"><table class="range-table"><thead><tr><th>${t.range}</th><th>${t.level}</th><th>${t.definition}</th></tr></thead><tbody>${ranges.map((r,i)=>`<tr class="${t.ranges[i][0]===x[0]?'current':''}"><td>${r[2]}</td><td>${t.ranges[i][0]}${t.ranges[i][0]===x[0]?t.current:''}</td><td>${t.ranges[i][1]}</td></tr>`).join('')}</tbody></table></div></div>`}
 function calcCohen(){const v=cohen.filter(r=>r[1]&&r[2]);if(!v.length)return null;const n=v.length,po=v.filter(r=>r[1]===r[2]).length/n;const cats=[...new Set(v.flatMap(r=>r.slice(1)))];const pe=cats.reduce((s,c)=>s+v.filter(r=>r[1]===c).length/n*v.filter(r=>r[2]===c).length/n,0);const k=pe===1?NaN:(po-pe)/(1-pe);const ng=v.filter(r=>r[1]==='NG'),ok=v.filter(r=>r[1]==='OK');return {n,k,acc:po,miss:ng.length?ng.filter(r=>r[2]==='OK').length/ng.length:NaN,fr:ok.length?ok.filter(r=>r[2]==='NG').length/ok.length:NaN,cats,m:cats.map(a=>cats.map(b=>v.filter(r=>r[1]===a&&r[2]===b).length))}}
 function calcFleiss(){const v=fleiss.filter(r=>r.slice(1).every(Boolean));if(!v.length)return null;const N=v.length,n=4,c=['OK','NG'];const counts=v.map(r=>c.map(x=>r.slice(1).filter(y=>y===x).length));const pbar=counts.map(cs=>cs.reduce((s,x)=>s+x*(x-1),0)/(n*(n-1))).reduce((a,b)=>a+b,0)/N;const pj=c.map((_,j)=>counts.reduce((s,cs)=>s+cs[j],0)/(N*n));const pe=pj.reduce((s,p)=>s+p*p,0);return {N,n,k:pe===1?NaN:(pbar-pe)/(1-pe)}}
 const f=n=>Number.isFinite(n)?n.toFixed(3):'–',pct=n=>Number.isFinite(n)?(n*100).toFixed(1)+'%':'–';
 function calcAll(){const t=languageText[currentLanguage],c=calcCohen();document.getElementById('cohenResult').innerHTML=c?`<div class="metrics"><div class="card metric"><div class="muted">${t.kappa}</div><div class="value">${f(c.k)}</div><div class="muted">${interp(c.k)[0]}</div></div><div class="card metric"><div class="muted">${t.valid}</div><div class="value">${c.n}</div></div></div><div class="rates"><div class="card metric"><div class="muted">${t.accuracy}</div><div class="value">${pct(c.acc)}</div></div><div class="card metric"><div class="muted">${t.miss}</div><div class="value">${pct(c.miss)}</div></div><div class="card metric"><div class="muted">${t.falseReject}</div><div class="value">${pct(c.fr)}</div></div></div><div class="card pad"><h3>${t.matrix}</h3><table><thead><tr><th>${t.matrixHead}</th>${c.cats.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${c.cats.map((x,i)=>`<tr><th>${x}</th>${c.m[i].map((v,j)=>`<td class="${i===j?'okcell':'badcell'}">${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${interpretation(c.k)}`:`<div class="card pad">${t.waiting}</div>`;const fl=calcFleiss();document.getElementById('fleissResult').innerHTML=fl?`<div class="metrics"><div class="card metric"><div class="muted">${t.kappa}</div><div class="value">${f(fl.k)}</div><div class="muted">${interp(fl.k)[0]}</div></div><div class="card metric"><div class="muted">${t.samplesRaters}</div><div class="value">${fl.N} × ${fl.n}</div></div></div>${interpretation(fl.k)}`:`<div class="card pad">${t.waiting}</div>`}
 function exportCSV(kind){
 const rows = kind === 'cohen' ? cohen : fleiss;
 const headers = kind === 'cohen'
 ? ['樣品','標準答案','檢驗員']
 : ['樣品','檢驗員A','檢驗員B','檢驗員C','檢驗員D'];
 const escapeCSV = value => '"' + String(value ?? '').replace(/"/g, '""') + '"';
 const lines = [headers, ...rows].map(row => row.map(escapeCSV).join(','));
 const csvContent = '\uFEFF' + lines.join('\r\n');
 const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
 const url = URL.createObjectURL(blob);
 const link = document.createElement('a');
 link.href = url;
 link.download = kind === 'cohen' ? 'cohen-kappa-data.csv' : 'fleiss-kappa-data.csv';
 link.style.display = 'none';
 document.body.appendChild(link);
 link.click();
 window.setTimeout(() => {
 link.remove();
 URL.revokeObjectURL(url);
 }, 1000);
 }
 document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});render();
 </script>
 </body></html>
