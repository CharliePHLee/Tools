 h1{font-size:clamp(32px,5vw,50px);margin:18px 0 8px}.lead{color:#475569;font-size:18px;line-height:1.7;max-width:1080px}.tabs{display:grid;grid-template-columns:1fr 1fr;max-width:760px;background:#f1f5f9;padding:5px;border-radius:15px;margin:28px 0 24px}.tab{border:0;background:transparent;padding:14px;border-radius:11px;font-size:16px;cursor:pointer}.tab.active{background:#fff;box-shadow:0 1px 5px #cbd5e1}.panel{display:none}.panel.active{display:block}.layout{display:grid;grid-template-columns:1.05fr .95fr;gap:20px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 2px 10px #0f172a0a;margin-bottom:14px}.pad{padding:18px}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.control label{display:block;color:var(--muted);font-size:12px;margin:0 0 5px}.btn{border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:10px;cursor:pointer}.btn:hover{background:#f8fafc}.table-wrap{overflow:auto;max-height:520px}table{width:100%;border-collapse:collapse;min-width:650px;font-family:inherit;font-size:16px;color:var(--ink)}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-family:inherit;font-size:16px;line-height:1.5;color:var(--ink)}th{font-weight:700}thead{background:#f8fafc;position:sticky;top:0;z-index:1}input,select,button{font-family:inherit}input,select{width:100%;height:38px;border:1px solid #cbd5e1;border-radius:8px;padding:0 10px;background:#fff;font-size:16px;line-height:1.5;color:var(--ink);font-weight:400}.repeat-label{display:inline-block;font-family:inherit;font-size:16px;font-weight:400;line-height:1.5;color:var(--ink)}.delete{border:0;background:transparent;color:var(--red);font-size:20px;cursor:pointer}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.rates{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{padding:16px}.metric .value{font-size:28px;font-weight:750;margin-top:5px}.muted{color:var(--muted);font-size:14px}.okcell{background:#ecfdf5;text-align:center;font-weight:700}.badcell{background:#fff1f2;text-align:center}.badge{display:inline-block;background:#e2e8f0;padding:4px 9px;border-radius:999px;font-size:12px}.range-table tr.current{background:#eff6ff}.range-table tr.current td:nth-child(2){font-weight:700;color:#1d4ed8}.chart-row{display:grid;grid-template-columns:90px 1fr 62px;gap:10px;align-items:center;margin:12px 0}.bar-track{height:14px;background:#eef2f7;border-radius:999px;overflow:hidden}.bar{height:100%;border-radius:999px;transition:width .25s}.bar-acc{background:var(--green)}.bar-miss{background:var(--red)}.bar-fr{background:var(--amber)}.round-card{padding:14px 0;border-bottom:1px solid var(--line)}.round-card:last-child{border-bottom:0}.note{padding:12px 14px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;color:#1e40af;font-size:13px;line-height:1.6}footer{text-align:center;color:#94a3b8;font-size:12px;margin-top:20px}@media(max-width:900px){.layout{grid-template-columns:1fr}.rates,.metrics{grid-template-columns:1fr}}

 <body><div class="wrap">
 <div class="top"><div class="pill">▦ Attribute Agreement Analysis</div><div class="langs"><button id="zhBtn" class="lang active" type="button">中文</button><button id="enBtn" class="lang" type="button">English</button></div></div>
 <h1 id="title"></h1><p id="lead" class="lead"></p>
 <div class="tabs"><button id="tabC" class="tab active" data-tab="cohen"></button><button id="tabF" class="tab" data-tab="fleiss"></button></div>
 <section id="cohen" class="panel active"><div class="layout"><div>
 <div class="head"><div><h2 id="cHead"></h2><div id="cHint" class="muted"></div></div><div class="controls"><div class="control"><label id="repeatLabel" for="repeatCount"></label><select id="repeatCount"><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select></div><button id="exportC" class="btn" type="button"></button></div></div>
 <div class="card"><div class="table-wrap"><table><thead><tr id="cHeaders"></tr></thead><tbody id="cBody"></tbody></table></div><div class="pad"><button id="addC" class="btn" type="button"></button></div></div></div><div id="cResult"></div></div></section>
 <section id="fleiss" class="panel"><div class="layout"><div>
 <div class="head"><div><h2 id="fHead"></h2><div id="fHint" class="muted"></div></div><div class="controls"><div class="control"><label id="fRepeatLabel" for="fRepeatCount"></label><select id="fRepeatCount"><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select></div><button id="exportF" class="btn" type="button"></button></div></div>
 <div class="card"><div class="table-wrap"><table><thead><tr id="fHeaders"></tr></thead><tbody id="fBody"></tbody></table></div><div class="pad"><button id="addF" class="btn" type="button"></button></div></div></div><div id="fResult"></div></div></section>
 <footer id="footer"></footer></div>
 <script>
 'use strict';
 let lang='zh';
 let repeatCount=2;
 let teamRepeatCount=2;
 const T={
 zh:{title:'品質檢驗 Kappa 計算器',lead:'使用 Cohen’s Kappa 考核個別檢驗員與標準答案的一致性，並分析同一檢驗員的重複測量一致性；使用 Fleiss’ Kappa 評估多位檢驗員的團隊一致性。',tabC:'個人 vs 標準',tabF:'多人團隊一致性',cHead:'輸入判定資料',cHint:'每個樣品設定 2 至 5 次重複檢驗。標準答案與檢驗員判定只能選擇 OK 或 NG。',fHead:'輸入多人判定資料',fHint:'每個樣品設定 2 至 5 次重複檢驗，每位檢驗員只能選擇 OK 或 NG。',repeat:'重複測量次數',sample:'樣品',round:'檢驗次數',standard:'標準答案',inspector:'檢驗員',select:'請選擇',export:'⇩ 匯出',add:'＋ 新增樣品',a:'檢驗員 A',b:'檢驗員 B',c:'檢驗員 C',d:'檢驗員 D',kappa:'Kappa κ',valid:'有效判定筆數',sr:'樣品數 × 評分者',accuracy:'正確率',miss:'漏檢率',falseReject:'誤判率',matrix:'交叉表',matrixHead:'標準 / 檢驗員',result:'結果解讀',current:'（目前結果）',range:'Kappa 範圍',level:'一致性等級',definition:'判斷定義',waiting:'輸入完整資料後，結果會即時計算。',cannot:'無法計算',need:'請確認資料至少包含 OK 與 NG，且資料不是完全單一類別。',footer:'此工具用於品質改善與內部分析。正式認證門檻應由組織依風險、客戶要求與程序文件制定。',repeatTitle:'重複測量一致性分析',repeatKappa:'重複測量 Kappa',pairAgreement:'成對一致率',allAgreement:'完全重複一致率',repeatNote:'重複測量 Kappa 將各次檢驗視為同一檢驗員的重複評定，用來衡量檢驗員自身判定的穩定性。',roundChart:'每次測量結果圖表',roundName:'第 {n} 次',completeSamples:'完整樣品數',teamRepeatTitle:'團隊重複測量一致性分析',inspectorRepeat:'{name} 重複測量',teamRepeatNote:'各檢驗員的重複測量 Kappa 用來評估同一檢驗員在不同次檢驗中的判定穩定性。僅納入各次判定皆完整的樣品。',ranges:[['低於隨機','實際一致程度低於隨機預期，判定可能存在系統性分歧。'],['輕微一致','僅有非常有限的一致性，通常需要重新訓練或釐清判定標準。'],['尚可一致','具有初步一致性，但穩定度仍不足，建議分析不一致樣品。'],['中度一致','判定具有中等程度的一致性，可使用但仍有改善空間。'],['高度一致','判定一致性良好，可搭配正確率、漏檢率及誤判率評估資格。'],['近乎完全一致','判定結果高度穩定且一致，仍建議定期以盲測確認能力。']]},
 en:{title:'Quality Inspection Kappa Calculator',lead:'Use Cohen’s Kappa to assess an inspector against the reference standard and analyze repeat-measurement consistency; use Fleiss’ Kappa to assess agreement across multiple inspectors.',tabC:'Individual vs Standard',tabF:'Multi-inspector Agreement',cHead:'Enter Rating Data',cHint:'Set 2 to 5 repeated inspections per sample. Reference and inspector ratings can only be OK or NG.',fHead:'Enter Multi-inspector Data',fHint:'Set 2 to 5 repeated inspections per sample. Each inspector rating can only be OK or NG.',repeat:'Repeated measurements',sample:'Sample',round:'Inspection round',standard:'Reference',inspector:'Inspector',select:'Select',export:'⇩ Export',add:'＋ Add Sample',a:'Inspector A',b:'Inspector B',c:'Inspector C',d:'Inspector D',kappa:'Kappa κ',valid:'Valid ratings',sr:'Samples × Raters',accuracy:'Accuracy',miss:'Miss rate',falseReject:'False reject rate',matrix:'Confusion Matrix',matrixHead:'Reference / Inspector',result:'Interpretation',current:' (current result)',range:'Kappa range',level:'Agreement level',definition:'Definition',waiting:'Results are calculated after complete data are entered.',cannot:'Cannot calculate',need:'Make sure the data include both OK and NG and are not limited to one category.',footer:'This tool is intended for quality improvement and internal analysis. Formal qualification thresholds should be defined according to organizational risk, customer requirements, and controlled procedures.',repeatTitle:'Repeat-measurement Consistency',repeatKappa:'Repeat-measurement Kappa',pairAgreement:'Pairwise agreement',allAgreement:'Complete repeat agreement',repeatNote:'Repeat-measurement Kappa treats inspection rounds as repeated ratings by the same inspector and measures within-inspector stability.',roundChart:'Results by Measurement Round',roundName:'Round {n}',completeSamples:'Complete samples',teamRepeatTitle:'Team Repeat-measurement Consistency',inspectorRepeat:'{name} repeat measurements',teamRepeatNote:'Repeat-measurement Kappa for each inspector evaluates within-inspector stability across inspection rounds. Only samples with complete repeated ratings are included.',ranges:[['Below chance','Observed agreement is lower than chance expectation and may indicate systematic disagreement.'],['Slight agreement','Agreement is very limited. Retraining or clarification of criteria is usually required.'],['Fair agreement','Initial agreement is present, but stability remains insufficient. Review disagreement samples.'],['Moderate agreement','Agreement is moderate and usable, but further improvement is recommended.'],['Substantial agreement','Agreement is good. Use accuracy, miss rate, and false reject rate together for qualification.'],['Almost perfect agreement','Ratings are highly stable and consistent. Periodic blind testing is still recommended.']]}
 };
 const rangeDefs=[[-Infinity,0,'κ < 0.00'],[0,.2,'0.00 ≤ κ ≤ 0.20'],[.2,.4,'0.20 < κ ≤ 0.40'],[.4,.6,'0.40 < κ ≤ 0.60'],[.6,.8,'0.60 < κ ≤ 0.80'],[.8,1,'0.80 < κ ≤ 1.00']];
 let samples=[{id:'S001',standard:'OK',ratings:['OK','OK']},{id:'S002',standard:'NG',ratings:['NG','NG']},{id:'S003',standard:'NG',ratings:['OK','NG']},{id:'S004',standard:'OK',ratings:['OK','OK']}];
 let teamSamples=[
 {id:'S001',rounds:[['OK','OK','OK','OK'],['OK','OK','OK','OK']]},
 {id:'S002',rounds:[['NG','NG','NG','OK'],['NG','NG','NG','NG']]},
 {id:'S003',rounds:[['NG','OK','NG','NG'],['NG','NG','NG','NG']]},
 {id:'S004',rounds:[['OK','OK','OK','OK'],['OK','OK','OK','OK']]}
 ];
 const $=id=>document.getElementById(id);
 const escapeHtml=value=>String(value??'').replace(/[&<>\"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[ch]));
 const choice=value=>`<select class="decision"><option value="">${T[lang].select}</option><option value="OK" ${value==='OK'?'selected':''}>OK</option><option value="NG" ${value==='NG'?'selected':''}>NG</option></select>`;
 function setLanguage(value){lang=value;document.documentElement.lang=value==='zh'?'zh-Hant':'en';$('zhBtn').classList.toggle('active',value==='zh');$('enBtn').classList.toggle('active',value==='en');render();}
 function setRepeatCount(value){const next=Math.max(2,Math.min(5,Number(value)||2));samples.forEach(sample=>{while(sample.ratings.length<next)sample.ratings.push('');sample.ratings=sample.ratings.slice(0,next);});repeatCount=next;render();}
 function setTeamRepeatCount(value){const next=Math.max(2,Math.min(5,Number(value)||2));teamSamples.forEach(sample=>{while(sample.rounds.length<next)sample.rounds.push(['','','','']);sample.rounds=sample.rounds.slice(0,next);});teamRepeatCount=next;render();}
 function render(){const t=T[lang];['title','lead','tabC','tabF','cHead','cHint','fHead','fHint','footer'].forEach(id=>$(id).textContent=t[id]);$('repeatLabel').textContent=t.repeat;$('fRepeatLabel').textContent=t.repeat;$('repeatCount').value=String(repeatCount);$('fRepeatCount').value=String(teamRepeatCount);$('exportC').textContent=t.export;$('exportF').textContent=t.export;$('addC').textContent=t.add;$('addF').textContent=t.add;
 $('cHeaders').innerHTML=`<th>${t.sample}</th><th>${t.round}</th><th>${t.standard}</th><th>${t.inspector}</th><th></th>`;
 $('fHeaders').innerHTML=`<th>${t.sample}</th><th>${t.round}</th><th>${t.a}</th><th>${t.b}</th><th>${t.c}</th><th>${t.d}</th><th></th>`;
 $('cBody').innerHTML=samples.map((sample,si)=>sample.ratings.map((rating,ri)=>`<tr data-kind="cohen" data-si="${si}" data-ri="${ri}"><td>${ri===0?`<input class="sample-id" value="${escapeHtml(sample.id)}">`:`<span class="repeat-label">${escapeHtml(sample.id)}</span>`}</td><td>${ri+1} / ${repeatCount}</td><td>${choice(sample.standard)}</td><td>${choice(rating)}</td><td>${ri===0?`<button class="delete remove-sample" type="button">×</button>`:''}</td></tr>`).join('')).join('');
 $('fBody').innerHTML=teamSamples.map((sample,si)=>sample.rounds.map((ratings,ri)=>`<tr data-kind="fleiss" data-si="${si}" data-ri="${ri}"><td>${ri===0?`<input class="team-id" value="${escapeHtml(sample.id)}">`:`<span class="repeat-label">${escapeHtml(sample.id)}</span>`}</td><td>${ri+1} / ${teamRepeatCount}</td>${ratings.map(value=>`<td>${choice(value)}</td>`).join('')}<td>${ri===0?`<button class="delete remove-team-sample" type="button">×</button>`:''}</td></tr>`).join('')).join('');attachTableEvents();calculateAll();}
 function attachTableEvents(){
 document.querySelectorAll('#cBody .sample-id').forEach(el=>el.addEventListener('change',event=>{samples[Number(event.target.closest('tr').dataset.si)].id=event.target.value;render();}));
 document.querySelectorAll('#cBody .decision').forEach(el=>el.addEventListener('change',event=>{const row=event.target.closest('tr'),si=Number(row.dataset.si),ri=Number(row.dataset.ri),col=[...row.children].indexOf(event.target.closest('td'));if(col===2)samples[si].standard=event.target.value;else samples[si].ratings[ri]=event.target.value;calculateAll();}));
 document.querySelectorAll('#cBody .remove-sample').forEach(el=>el.addEventListener('click',event=>{samples.splice(Number(event.target.closest('tr').dataset.si),1);render();}));
 document.querySelectorAll('#fBody .team-id').forEach(el=>el.addEventListener('change',event=>{teamSamples[Number(event.target.closest('tr').dataset.si)].id=event.target.value;render();}));
 document.querySelectorAll('#fBody .decision').forEach(el=>el.addEventListener('change',event=>{const row=event.target.closest('tr'),si=Number(row.dataset.si),ri=Number(row.dataset.ri),col=[...row.children].indexOf(event.target.closest('td'));teamSamples[si].rounds[ri][col-2]=event.target.value;calculateAll();}));
 document.querySelectorAll('#fBody .remove-team-sample').forEach(el=>el.addEventListener('click',event=>{teamSamples.splice(Number(event.target.closest('tr').dataset.si),1);render();}));
 }
 function addSample(){samples.push({id:`S${String(samples.length+1).padStart(3,'0')}`,standard:'',ratings:Array(repeatCount).fill('')});render();}
 function addFleiss(){teamSamples.push({id:`S${String(teamSamples.length+1).padStart(3,'0')}`,rounds:Array.from({length:teamRepeatCount},()=>['','','',''])});render();}
 function flattenRatings(){return samples.flatMap(s=>s.ratings.map((rating,index)=>[s.id,index+1,s.standard,rating])).filter(row=>row[2]&&row[3]);}
 function cohenStats(rows){if(!rows.length)return null;const n=rows.length,po=rows.filter(r=>r[2]===r[3]).length/n,cats=[...new Set(rows.flatMap(r=>r.slice(2,4)))],pe=cats.reduce((sum,c)=>sum+(rows.filter(r=>r[2]===c).length/n)*(rows.filter(r=>r[3]===c).length/n),0),k=pe===1?NaN:(po-pe)/(1-pe),ng=rows.filter(r=>r[2]==='NG'),ok=rows.filter(r=>r[2]==='OK');return{n,k,acc:po,miss:ng.length?ng.filter(r=>r[3]==='OK').length/ng.length:NaN,fr:ok.length?ok.filter(r=>r[3]==='NG').length/ok.length:NaN,cats,matrix:cats.map(a=>cats.map(b=>rows.filter(r=>r[2]===a&&r[3]===b).length))};}
 function fleissFromRatings(ratingMatrix){return fleissGeneric(ratingMatrix,repeatCount);}
 function teamFleiss(){const rows=teamSamples.flatMap(sample=>sample.rounds).filter(row=>row.every(Boolean));if(!rows.length)return null;const N=rows.length,n=4,cats=['OK','NG'],counts=rows.map(row=>cats.map(c=>row.filter(v=>v===c).length)),pbar=counts.map(cs=>cs.reduce((sum,x)=>sum+x*(x-1),0)/(n*(n-1))).reduce((a,b)=>a+b,0)/N,pj=cats.map((_,j)=>counts.reduce((sum,cs)=>sum+cs[j],0)/(N*n)),pe=pj.reduce((sum,p)=>sum+p*p,0);return{N,n,k:pe===1?NaN:(pbar-pe)/(1-pe)};}
 function teamRepeatStats(){return [0,1,2,3].map(inspectorIndex=>{const matrix=teamSamples.map(sample=>sample.rounds.map(round=>round[inspectorIndex]));return fleissGeneric(matrix,teamRepeatCount);});}
 function fleissGeneric(matrix,roundCount){const complete=matrix.filter(row=>row.length===roundCount&&row.every(Boolean));if(!complete.length)return null;const N=complete.length,n=roundCount,cats=['OK','NG'],counts=complete.map(row=>cats.map(c=>row.filter(v=>v===c).length)),itemP=counts.map(cs=>cs.reduce((sum,x)=>sum+x*(x-1),0)/(n*(n-1))),pbar=itemP.reduce((a,b)=>a+b,0)/N,pj=cats.map((_,j)=>counts.reduce((sum,cs)=>sum+cs[j],0)/(N*n)),pe=pj.reduce((sum,p)=>sum+p*p,0),k=pe===1?NaN:(pbar-pe)/(1-pe),all=complete.filter(row=>row.every(value=>value===row[0])).length/N;return{N,n,k,pair:pbar,all};}
 function perRoundStats(){return Array.from({length:repeatCount},(_,index)=>{const rows=samples.filter(s=>s.standard&&s.ratings[index]).map(s=>[s.id,index+1,s.standard,s.ratings[index]]);return cohenStats(rows);});}
 const number=value=>Number.isFinite(value)?value.toFixed(3):'–';const percent=value=>Number.isFinite(value)?`${(value*100).toFixed(1)}%`:'–';
 function interpretation(k){const t=T[lang];if(!Number.isFinite(k))return[t.cannot,t.need,-1];let index=rangeDefs.findIndex((r,i)=>i===0?k<r[1]:k>r[0]&&k<=r[1]);if(index<0)index=1;return[t.ranges[index][0],t.ranges[index][1],index];}
 function interpretationCard(k){const t=T[lang],x=interpretation(k);return`<div class="card pad"><h3>${t.result} <span class="badge">${x[0]}</span></h3><p class="muted">${x[1]}</p><div class="table-wrap"><table class="range-table"><thead><tr><th>${t.range}</th><th>${t.level}</th><th>${t.definition}</th></tr></thead><tbody>${rangeDefs.map((r,i)=>`<tr class="${i===x[2]?'current':''}"><td>${r[2]}</td><td>${t.ranges[i][0]}${i===x[2]?t.current:''}</td><td>${t.ranges[i][1]}</td></tr>`).join('')}</tbody></table></div></div>`;}
 function rateBar(label,value,cls){return`<div class="chart-row"><span>${label}</span><div class="bar-track"><div class="bar ${cls}" style="width:${Number.isFinite(value)?Math.max(0,Math.min(100,value*100)):0}%"></div></div><strong>${percent(value)}</strong></div>`;}
 function roundCharts(){const t=T[lang],stats=perRoundStats();return`<div class="card pad"><h3>${t.roundChart}</h3>${stats.map((s,i)=>`<div class="round-card"><strong>${t.roundName.replace('{n}',String(i+1))}</strong>${s?rateBar(t.accuracy,s.acc,'bar-acc')+rateBar(t.miss,s.miss,'bar-miss')+rateBar(t.falseReject,s.fr,'bar-fr'):`<p class="muted">${t.waiting}</p>`}</div>`).join('')}</div>`;}
 function calculateAll(){const t=T[lang],overall=cohenStats(flattenRatings()),repeat=fleissFromRatings(samples.map(s=>s.ratings));$('cResult').innerHTML=overall?`<div class="metrics"><div class="card metric"><div class="muted">${t.kappa}</div><div class="value">${number(overall.k)}</div><div class="muted">${interpretation(overall.k)[0]}</div></div><div class="card metric"><div class="muted">${t.valid}</div><div class="value">${overall.n}</div></div></div><div class="rates"><div class="card metric"><div class="muted">${t.accuracy}</div><div class="value">${percent(overall.acc)}</div></div><div class="card metric"><div class="muted">${t.miss}</div><div class="value">${percent(overall.miss)}</div></div><div class="card metric"><div class="muted">${t.falseReject}</div><div class="value">${percent(overall.fr)}</div></div></div>${repeat?`<div class="card pad"><h3>${t.repeatTitle}</h3><div class="metrics"><div class="metric"><div class="muted">${t.repeatKappa}</div><div class="value">${number(repeat.k)}</div></div><div class="metric"><div class="muted">${t.completeSamples}</div><div class="value">${repeat.N}</div></div><div class="metric"><div class="muted">${t.pairAgreement}</div><div class="value">${percent(repeat.pair)}</div></div><div class="metric"><div class="muted">${t.allAgreement}</div><div class="value">${percent(repeat.all)}</div></div></div><div class="note">${t.repeatNote}</div></div>`:''}${roundCharts()}<div class="card pad"><h3>${t.matrix}</h3><table><thead><tr><th>${t.matrixHead}</th>${overall.cats.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${overall.cats.map((c,i)=>`<tr><th>${c}</th>${overall.matrix[i].map((v,j)=>`<td class="${i===j?'okcell':'badcell'}">${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${interpretationCard(overall.k)}`:`<div class="card pad">${t.waiting}</div>`;
 const team=teamFleiss(),repeatStats=teamRepeatStats(),names=[t.a,t.b,t.c,t.d];$('fResult').innerHTML=team?`<div class="metrics"><div class="card metric"><div class="muted">${t.kappa}</div><div class="value">${number(team.k)}</div><div class="muted">${interpretation(team.k)[0]}</div></div><div class="card metric"><div class="muted">${t.sr}</div><div class="value">${team.N} × ${team.n}</div></div></div><div class="card pad"><h3>${t.teamRepeatTitle}</h3><div class="note">${t.teamRepeatNote}</div>${repeatStats.map((stat,index)=>`<div class="round-card"><strong>${t.inspectorRepeat.replace('{name}',names[index])}</strong>${stat?`<div class="metrics"><div class="metric"><div class="muted">${t.repeatKappa}</div><div class="value">${number(stat.k)}</div></div><div class="metric"><div class="muted">${t.completeSamples}</div><div class="value">${stat.N}</div></div><div class="metric"><div class="muted">${t.pairAgreement}</div><div class="value">${percent(stat.pair)}</div></div><div class="metric"><div class="muted">${t.allAgreement}</div><div class="value">${percent(stat.all)}</div></div></div>`:`<p class="muted">${t.waiting}</p>`}</div>`).join('')}</div>${interpretationCard(team.k)}`:`<div class="card pad">${t.waiting}</div>`;}
 function exportCSV(kind){const t=T[lang];let headers,rows,name;if(kind==='cohen'){headers=[t.sample,t.round,t.standard,t.inspector];rows=samples.flatMap(s=>s.ratings.map((rating,i)=>[s.id,i+1,s.standard,rating]));name='cohen-kappa-repeated-data.csv';}else{headers=[t.sample,t.round,t.a,t.b,t.c,t.d];rows=teamSamples.flatMap(sample=>sample.rounds.map((ratings,index)=>[sample.id,index+1,...ratings]));name='fleiss-kappa-repeated-data.csv';}const quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv='\uFEFF'+[headers,...rows].map(row=>row.map(quote).join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=name;link.style.display='none';document.body.appendChild(link);link.click();setTimeout(()=>{link.remove();URL.revokeObjectURL(url);},1000);}
 $('zhBtn').addEventListener('click',()=>setLanguage('zh'));$('enBtn').addEventListener('click',()=>setLanguage('en'));$('repeatCount').addEventListener('change',e=>setRepeatCount(e.target.value));$('fRepeatCount').addEventListener('change',e=>setTeamRepeatCount(e.target.value));$('addC').addEventListener('click',addSample);$('addF').addEventListener('click',addFleiss);$('exportC').addEventListener('click',()=>exportCSV('cohen'));$('exportF').addEventListener('click',()=>exportCSV('fleiss'));document.querySelectorAll('.tab').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.tab,.panel').forEach(el=>el.classList.remove('active'));button.classList.add('active');$(button.dataset.tab).classList.add('active');}));render();
 </script></body></html>
